<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Chess Admin</h1>

    <section>
        <h2>Игроки</h2>

        <table id="playersTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Имя</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="form-block">
            <h3>Добавить игрока</h3>
            <input id="playerId" type="text" placeholder="ID">
            <input id="playerName" type="text" placeholder="Имя">
            <button type="button" onclick="addPlayer()">Добавить игрока</button>
        </div>
    </section>

    <section>
        <h2>Турниры</h2>

        <table id="tournamentsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="form-block">
            <h3>Добавить турнир</h3>
            <input id="tournamentId" type="text" placeholder="ID">
            <input id="tournamentName" type="text" placeholder="Название">
            <button type="button" onclick="addTournament()">Добавить турнир</button>
        </div>
    </section>

    <section>
        <h2>Результаты</h2>

        <div id="resultsContainer"></div>

        <div class="form-block">
            <h3>Добавить результат турнира</h3>

            <div class="result-form-fields">
                <label for="resultTournamentId">Турнир</label>
                <select id="resultTournamentId"></select>

                <label for="resultYear">Год</label>
                <input id="resultYear" type="number" min="1" step="1" placeholder="2026">
            </div>

            <div id="resultPlayersFields" class="player-results"></div>

            <button type="button" onclick="addResult()">Добавить результат</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
